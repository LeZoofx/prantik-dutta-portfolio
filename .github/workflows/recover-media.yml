name: Restore missing portfolio images
on:
  push:
    branches: [main]
    paths:
      - scripts/recover-media.py
      - .github/workflows/recover-media.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-media-recovery
  cancel-in-progress: false
jobs:
  recover:
    # Security-only workflow edits must not replace existing portfolio media.
    if: github.actor == github.repository_owner && !contains(github.event.head_commit.message, '[skip media recovery]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/recover-media.py
      - name: Save recovered images
        run: |
          git config user.name "Portfolio media recovery"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/media
          git diff --cached --quiet || git commit -m "Restore portfolio media from original sources"
          git push origin main
  publish:
    needs: recover
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
