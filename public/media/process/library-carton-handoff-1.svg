<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660"><rect width="1440" height="660" fill="white"/><g font-family="Arial" fill="#303334"><text x="54" y="45" font-size="27" font-weight="bold">Carton panel allocation</text><text x="54" y="78" font-size="18">W = front width  /  D = side depth  /  H = body height  /  G = glue flap</text></g><g fill="#FAFAF6" stroke="#303334" stroke-width="2"><rect x="90" y="175" width="58" height="330"/><rect x="148" y="175" width="295" height="330"/><rect x="443" y="175" width="165" height="330"/><rect x="608" y="175" width="295" height="330"/><rect x="903" y="175" width="165" height="330"/><rect x="148" y="105" width="295" height="70"/><rect x="608" y="105" width="295" height="70"/><rect x="148" y="505" width="295" height="70"/><rect x="608" y="505" width="295" height="70"/></g><g stroke="#D92140" stroke-width="2" stroke-dasharray="8 6"><path d="M148 175V505 M443 175V505 M608 175V505 M903 175V505 M148 175H443 M608 175H903 M148 505H443 M608 505H903"/></g><g font-family="Arial" fill="#303334" font-size="22" text-anchor="middle"><text x="119" y="318" transform="rotate(-90 119 318)">GLUE / G</text><text x="295" y="286" font-weight="bold">FRONT / W</text><text x="295" y="332">Wordmark</text><text x="295" y="365">Product lettering</text><text x="295" y="398">Descriptor / icons</text><text x="295" y="431">Mosaic / net quantity</text><text x="525" y="286" font-weight="bold">SIDE / D</text><text x="525" y="342">Use steps</text><text x="756" y="286" font-weight="bold">BACK / W</text><text x="756" y="332">Formula / nutrition</text><text x="756" y="365">Storage / warnings</text><text x="756" y="398">Manufacturer / batch</text><text x="756" y="431">MRP / barcode</text><text x="986" y="286" font-weight="bold">SIDE / D</text><text x="986" y="342">Supporting copy</text><text x="295" y="150">TOP</text><text x="756" y="150">TOP</text><text x="295" y="548">BOTTOM</text><text x="756" y="548">BOTTOM</text></g><g font-family="Arial" fill="#626767" font-size="20"><text x="1110" y="225">Panel widths</text><text x="1110" y="260">G + W + D + W + D</text><text x="1110" y="315">Flat width</text><text x="1110" y="350">2W + 2D + G</text><text x="1110" y="405">Flat height</text><text x="1110" y="440">H + flap allowances</text><text x="54" y="625">Panel relationship diagram. Converter supplies cut, crease, closure and glue geometry before artwork fit.</text></g></svg>